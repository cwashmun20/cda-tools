name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Create placeholder API config
        run: cp cda_core/lib/api/config.py.example cda_core/lib/api/config.py

      - name: Run all checks (black, flake8, mypy, pytest)
        run: python scripts/check.py

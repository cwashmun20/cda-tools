[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cda-tools"
version = "0.1.0"
description = "Fair Level Certification tools for the Collegiate Dancesport Association"
readme = "README.md"
authors = [
    { name = "Clifford Ashmun", email = "cwashmun20@hmc.edu" },
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "numpy>=2.2",
    "pandas>=2.2",
    "requests>=2.32",
    "pytz",
]

[project.scripts]
entry-checker = "flc_entry_checking.lib.entry_checker:main"

[tool.setuptools.packages.find]
include = ["cda_core*", "flc_entry_checking*", "flc_points*"]